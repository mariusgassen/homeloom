# Local development: publishes ports on localhost. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  homeloom-web:
    ports:
      - "127.0.0.1:3000:8080"
  homeloom-api:
    ports:
      - "127.0.0.1:8080:8080"
  homeloom-postgres:
    ports:
      - "127.0.0.1:5432:5432"
  homeloom-redis:
    ports:
      - "127.0.0.1:6379:6379"
