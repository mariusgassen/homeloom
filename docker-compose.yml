# Deployed by Coolify as a Docker Compose resource. Service names carry the homeloom- prefix
# so the containers are easy to find in Coolify. Assign the public domain to homeloom-web in
# the Coolify UI: it serves the PWA and forwards /auth, /v1 and the health checks to
# homeloom-api, and /rtc (call signalling) to homeloom-livekit. The API, Postgres, Redis and
# Garage stay on the internal network; LiveKit publishes its media ports, which the firewall must let through.
services:
  homeloom-web:
    build: ./apps/web
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      homeloom-api:
        condition: service_healthy

  homeloom-api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homeloom}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@homeloom-postgres:5432/${POSTGRES_DB:-homeloom}?sslmode=disable
      REDIS_URL: redis://homeloom-redis:6379/0
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      OIDC_CLIENT_IDS: ${OIDC_CLIENT_IDS:-}
      SESSION_TTL: ${SESSION_TTL:-720h}
      MEALIE_MCP_URL: ${MEALIE_MCP_URL:-}
      MEALIE_MCP_TOKEN: ${MEALIE_MCP_TOKEN:-}
      MEALIE_URL: ${MEALIE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
      HOMELOOM_SECRET_KEY: ${HOMELOOM_SECRET_KEY:-}
      PLEX_ENABLED: ${PLEX_ENABLED:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      LIVEKIT_URL: http://homeloom-livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-homeloom}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      # Calls with Homeloom need speech (OpenAI) and Claude; without either key they're off.
      # The API uses the OpenAI key only for voice previews in Settings.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # With an S3 key pair new moment photos go to homeloom-garage (or another S3 store at
      # S3_ENDPOINT); without one they stay in Postgres.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://homeloom-garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-homeloom}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      TIME_ZONE: ${TIME_ZONE:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8080"
    depends_on:
      homeloom-postgres:
        condition: service_healthy
      homeloom-redis:
        condition: service_healthy

  # Voice and video calls. Signalling goes through homeloom-web on the app's domain; audio and
  # video use UDP 7882 (TCP 7881 where UDP is blocked) on the server's public IP.
  homeloom-livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-homeloom}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        room:
          empty_timeout: 60
        logging:
          level: info
    expose:
      - "7880"
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    # LiveKit answers OK on / once it's up; without a check Coolify shows the stack's health as unknown.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Homeloom's voice: joins a call when someone taps the phone in the assistant, hears with
  # OpenAI, thinks with Claude and acts as the caller through the API's MCP server. Without
  # OPENAI_API_KEY or ANTHROPIC_API_KEY it idles. The image has its own health check.
  homeloom-agent:
    build: ./apps/agent
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ws://homeloom-livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-homeloom}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOICE_LLM_MODEL: ${VOICE_LLM_MODEL:-claude-sonnet-5-5}
      VOICE_NOISE_CANCELLATION: ${VOICE_NOISE_CANCELLATION:-dtln}
      HOMELOOM_MCP_URL: http://homeloom-api:8080/mcp
      TIME_ZONE: ${TIME_ZONE:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - homeloom-livekit
      - homeloom-api

  # S3 storage (Garage, one node) for photos and other files. It sets itself up on start: the
  # bucket S3_BUCKET and the key S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY with access to it.
  # Without the key it runs empty. Only the API reaches it, on the internal network.
  homeloom-garage:
    build: ./apps/garage
    restart: unless-stopped
    environment:
      S3_BUCKET: ${S3_BUCKET:-homeloom}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - homeloom-garage-data:/var/lib/garage
    expose:
      - "3900"
    # /health answers once the node has its layout; the S3 port must be listening too.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3903/health >/dev/null && nc -z 127.0.0.1 3900"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  homeloom-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-homeloom}
    volumes:
      - homeloom-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  homeloom-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - homeloom-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  homeloom-postgres-data:
  homeloom-redis-data:
  homeloom-garage-data:
