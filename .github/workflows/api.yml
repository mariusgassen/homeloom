name: api

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/api/**"
      - "docker-compose*.yml"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- .
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # Build with the project's Go so the linter understands the newest language version.
          install-mode: goinstall
          working-directory: apps/api

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: homeloom
          POSTGRES_PASSWORD: homeloom
          POSTGRES_DB: homeloom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homeloom" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://homeloom:homeloom@localhost:5432/homeloom?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t homeloom-api:ci .
      - name: Binary fails fast without config
        run: |
          # Without env the binary must exit non-zero with a clear message.
          if docker run --rm homeloom-api:ci 2>err.txt; then exit 1; fi
          grep -q "missing required env" err.txt
