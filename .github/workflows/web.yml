name: web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/api/openapi.yaml"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API types match the contract
        run: |
          npm run generate
          git diff --exit-code -- src/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t homeloom-web:ci .
      - name: Caddy config is valid
        run: docker run --rm homeloom-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
