# Commit prefixes make Dependabot's PR titles Conventional Commits (checked by pr-title.yml).
# Updates that change the shipped image are fixes, so they cut a patch release.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    # typescript-eslint caps its typescript peer below 6.1, so TypeScript 7 breaks `npm ci`.
    # Lift this once typescript-eslint supports it.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: npm
    directory: /apps/agent
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    # Silero pins onnxruntime-node and two versions can't share a process; a test keeps them equal.
    # typescript-eslint caps its typescript peer below 6.1, so TypeScript 7 breaks `npm ci`.
    # Lift the typescript rule once typescript-eslint supports it.
    ignore:
      - dependency-name: onnxruntime-node
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/agent
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: docker
    directory: /apps/garage
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
