openapi: 3.0.3
info:
  title: Homeloom API
  version: 0.50.0
  description: |
    The contract for every Homeloom client (PWA, native apps, MCP, third-party apps).
    This file is the source of truth: server code is generated from it, never the other way round.

    Language: send `Accept-Language`; the API answers in German (`de`) or English (`en`, the fallback)
    and says which in `Content-Language`. `info.version` is the version of this contract, bumped by
    hand when the contract changes; the app's release version is reported by `/healthz`.

    Sign-in: the PWA is a confidential authentik client and never sees a token. It navigates to
    `/auth/login`; the API runs the authorization code flow (with PKCE) and sets an HttpOnly
    `homeloom_session` cookie. Native apps, the MCP server and third-party clients send an
    authentik access token as `Authorization: Bearer` instead. Either one authenticates a request.
servers:
  - url: /
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: system
  - name: auth
  - name: me
  - name: households
  - name: questions
  - name: entries
  - name: moments
  - name: cook
  - name: shopping
  - name: bucket
  - name: chores
  - name: gifts
  - name: documents
  - name: budget
  - name: trips
  - name: wishes
  - name: home
  - name: watch
  - name: date-night
  - name: places
  - name: push
  - name: assistant
  - name: calls

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Readiness probe (checks Postgres and Redis)
      security: []
      responses:
        "200":
          description: All dependencies are reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: At least one dependency is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /auth/login:
    get:
      tags: [auth]
      operationId: startLogin
      summary: Start the sign-in at authentik (browser navigation, not fetch)
      security: []
      responses:
        "302":
          description: Redirect to authentik. Sets a short-lived `homeloom_login` cookie that binds the attempt to this browser.
          headers:
            Location: { required: true, schema: { type: string } }
            Set-Cookie: { required: true, schema: { type: string } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/callback:
    get:
      tags: [auth]
      operationId: completeLogin
      summary: Redirect target registered in authentik; finishes the sign-in
      description: |
        Always redirects back into the app. On success it sets the `homeloom_session` cookie and
        redirects to `/`; otherwise it redirects to `/?auth_error=<code>`, where code is
        `login_failed` or `auth_unavailable`.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: Set by authentik when the user cancelled or was denied. }
        - { name: homeloom_login, in: cookie, schema: { type: string } }
      responses:
        "302":
          description: Back to the app.
          headers:
            Location: { required: true, schema: { type: string } }
            Set-Cookie: { schema: { type: string } }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      description: |
        Deletes the session and clears the cookie. Works without a valid session. Send the browser
        to `redirectUrl`, when present, to sign out of authentik as well.
      security: []
      parameters:
        - { name: homeloom_session, in: cookie, schema: { type: string } }
      responses:
        "200":
          description: Signed out.
          headers:
            Set-Cookie: { required: true, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Logout" }

  /auth/homeassistant/callback:
    get:
      tags: [home]
      operationId: completeHomeConnection
      summary: Redirect target of Home Assistant's sign-in; connects the caller
      description: |
        Always redirects back to `/home`. On failure it adds `?home_error=<code>`, where code is
        `connect_failed` or `home_unavailable`.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: Set when the sign-in was cancelled or denied. }
      responses:
        "302":
          description: Back to the app.
          headers:
            Location: { required: true, schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/plex/callback:
    get:
      tags: [watch]
      operationId: completeWatchConnection
      summary: Where Plex's sign-in comes back to; connects the caller
      description: |
        Always redirects back to `/watch`. On failure it adds `?watch_error=<code>`, where code is
        `connect_failed` or `watch_unavailable`.
      parameters:
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302":
          description: Back to the app.
          headers:
            Location: { required: true, schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in user, created on first call
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/avatar:
    put:
      tags: [me]
      operationId: setAvatar
      summary: Set your own picture
      description: |
        A JPEG of at most 5 MB; the app makes it square and small first. It wins over the picture
        authentik sends.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: You, with the new picture.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [me]
      operationId: deleteAvatar
      summary: Remove your own picture
      description: Afterwards you have authentik's picture again, if it sends one.
      responses:
        "200":
          description: You, without it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/users/{userId}/avatar:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [me]
      operationId: getAvatar
      summary: A member's picture
      description: |
        Use the user's `avatarUrl`; it changes with the picture, so the answer may be cached. Only
        you and the people you share a household with can see yours.
      parameters:
        - name: v
          in: query
          description: The picture's version, part of `avatarUrl`.
          schema: { type: string, maxLength: 40 }
      responses:
        "200":
          description: The picture.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/birthday:
    put:
      tags: [gifts]
      operationId: setBirthday
      summary: Set your own birthday
      description: Month and day, and the year of birth if you like; the household sees it, so the others can think of a gift in time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Birthday" }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [gifts]
      operationId: deleteBirthday
      summary: Remove your own birthday
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/location:
    put:
      tags: [places]
      operationId: setLocation
      summary: Share where you are, for your own weather
      description: |
        The device's position, from the browser's geolocation. The morning briefing and your date
        night forecast use it instead of the household's place, for as long as it is fresh (three
        days); a client sends it again whenever the app opens. The API keeps only this last
        position and the name of the town it is in, and nothing else is ever done with it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Coordinates" }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [places]
      operationId: deleteLocation
      summary: Stop sharing where you are
      description: Your weather is then the household's place again.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/households/{householdId}/gifts:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [gifts]
      operationId: getGifts
      summary: Your gift ideas and the birthdays they are for (members only)
      description: |
        Gift ideas are private to whoever wrote them: this lists only the caller's own, and nothing
        in the API, the assistant or a notification shows an idea to anyone else.
      responses:
        "200":
          description: Your birthday, the other members soonest birthday first, and your own ideas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gifts" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/gifts/ideas:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [gifts]
      operationId: addGiftIdea
      summary: Keep a gift idea for another member (private to you)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewGiftIdea" }
      responses:
        "201":
          description: The idea.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftIdea" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/gifts/ideas/{ideaId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/GiftIdeaId"
    patch:
      tags: [gifts]
      operationId: updateGiftIdea
      summary: Mark one of your ideas as given, or as an idea again
      description: Someone else's idea is not found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftIdeaUpdate" }
      responses:
        "200":
          description: The idea.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftIdea" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [gifts]
      operationId: deleteGiftIdea
      summary: Delete one of your ideas
      description: Someone else's idea is not found.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/voice:
    get:
      tags: [me]
      operationId: getVoice
      summary: How Homeloom sounds on the caller's calls with it
      description: |
        The caller's voice settings for calls with Homeloom, the defaults until they save their own,
        and whether Homeloom can speak at all on this server.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceSetup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [me]
      operationId: saveVoice
      summary: Save how Homeloom sounds on the caller's calls with it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceSettings" }
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/voice/preview:
    post:
      tags: [me]
      operationId: previewVoice
      summary: Hear a short sentence spoken with the given settings
      description: |
        Speaks a short sentence in the request's language, so settings can be tried before they're
        saved. Answers `503 voice_unavailable` when speech isn't set up.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceSettings" }
      responses:
        "200":
          description: The sentence as MP3.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households:
    get:
      tags: [households]
      operationId: listHouseholds
      summary: Households the current user belongs to
      responses:
        "200":
          description: The user's households.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Household" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [households]
      operationId: createHousehold
      summary: Create a household; the caller becomes its owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHousehold" }
      responses:
        "201":
          description: The new household.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/households/{householdId}:
    parameters:
      - name: householdId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [households]
      operationId: getHousehold
      summary: One household with its members (members only)
      responses:
        "200":
          description: The household.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [households]
      operationId: updateHousehold
      summary: Choose where the household lives (members only)
      description: |
        The place is a town or city, as typed. The morning briefing looks up its weather there.
        An empty place clears it. A place the weather service doesn't know answers 400
        `unknown_place`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place]
              properties:
                place: { type: string, maxLength: 100 }
      responses:
        "200":
          description: The household.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/members/{userId}/birthday:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [households]
      operationId: setMemberBirthday
      summary: Set a member's birthday (owner only)
      description: The owner keeps the household's details; everyone else changes only their own, at `/v1/me/birthday`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Birthday" }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You are a member but not the owner (code `not_owner`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [households]
      operationId: deleteMemberBirthday
      summary: Remove a member's birthday (owner only)
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You are a member but not the owner (code `not_owner`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/members/{userId}/avatar:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [households]
      operationId: setMemberAvatar
      summary: Set a member's picture (owner only)
      description: A JPEG of at most 5 MB, like `/v1/me/avatar`.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The member, with the new picture.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You are a member but not the owner (code `not_owner`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [households]
      operationId: deleteMemberAvatar
      summary: Remove a member's own picture (owner only)
      responses:
        "200":
          description: The member, without it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You are a member but not the owner (code `not_owner`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/invites:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [households]
      operationId: createInvite
      summary: Create a one-time invite link code (members only)
      responses:
        "201":
          description: The invite. The code is shown once; only its hash is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/invites/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 100 }
    post:
      tags: [households]
      operationId: acceptInvite
      summary: Join the household an invite belongs to
      description: Uses the invite up. Accepting an invite to a household you already belong to leaves it unused.
      responses:
        "200":
          description: The household joined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown, used or expired invite (code `invite_invalid`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/households/{householdId}/questions:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [questions]
      operationId: listQuestions
      summary: The household's questions, newest first (members only)
      responses:
        "200":
          description: Up to 50 questions. Other members' answers carry no text until the question is revealed.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Question" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [questions]
      operationId: askQuestion
      summary: Ask the household a question
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskQuestion" }
      responses:
        "201":
          description: The new question.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/questions/suggestions:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [questions]
      operationId: suggestQuestions
      summary: Fresh questions to ask, written by Claude (members only)
      description: |
        A few new questions in the caller's language, different on every call. Claude sees the
        household's recent questions so it doesn't repeat them. When Claude can't be reached the
        answer is 503 and the client offers its own.
      responses:
        "200":
          description: Up to five questions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionSuggestions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/questions/{questionId}:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [questions]
      operationId: updateQuestion
      summary: Reword your question, until someone else has answered it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskQuestion" }
      responses:
        "200":
          description: The question after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Someone else asked this question (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Someone else has answered it already, so it can no longer change (code `already_answered`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [questions]
      operationId: deleteQuestion
      summary: Delete your question and its answers
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Someone else asked this question (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/questions/{questionId}/answer:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [questions]
      operationId: answerQuestion
      summary: Write or change your answer; the question opens once every member has answered
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerQuestion" }
      responses:
        "200":
          description: The question after answering.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The question is already revealed; answers can no longer change (code `already_revealed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/households/{householdId}/entries:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [entries]
      operationId: listEntries
      summary: Calendar events, notes and reminders you can see (members only)
      description: |
        Your own entries plus everyone's shared and "later" ones; others' private entries never
        appear. A "later" entry by someone else carries no text until `revealAt` (`sealed` is true).
        Grouped by kind: events by start, from today on (a repeating event appears once, at its
        next time); notes newest first; open reminders by due time, then those done in the last
        7 days. At most 200.
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/EntryKind" }
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [entries]
      operationId: createEntry
      summary: Write a note, set a reminder or add a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEntry" }
      responses:
        "201":
          description: The new entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/entries/suggestions:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [entries]
      operationId: listReminderSuggestions
      summary: Reminders you set before, to set again (members only)
      description: |
        Titles of past reminders you can see, most often used first, then most recently. Titles
        of open reminders are left out. At most 20.
      responses:
        "200":
          description: The suggestions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TitleSuggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/calendar-feed:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [entries]
      operationId: getCalendarFeed
      summary: Whether you have a calendar subscription link
      responses:
        "200":
          description: The link's state; the link itself is only shown when it is made.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarFeedState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [entries]
      operationId: createCalendarFeed
      summary: Make a calendar subscription link; an earlier one stops working
      description: |
        Subscribe to `webcal://<host><path>` in a calendar app (on iPhone: open the link, or
        Settings › Calendar › Accounts › Add Subscribed Calendar). The feed holds the events and
        dated open reminders you can see in Homeloom. Only a hash of the token is stored.
      responses:
        "201":
          description: The new link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarFeedLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [entries]
      operationId: deleteCalendarFeed
      summary: Turn your calendar subscription link off
      responses:
        "204": { description: The link no longer works. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/calendar-feeds/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 100 }
    get:
      tags: [entries]
      operationId: getCalendar
      summary: The iCalendar feed behind a subscription link
      description: The token is the credential, so calendar apps can fetch it without signing in.
      security: []
      responses:
        "200":
          description: An iCalendar (RFC 5545) document.
          content:
            text/calendar:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    get:
      tags: [entries]
      operationId: getEntry
      summary: One entry
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [entries]
      operationId: updateEntry
      summary: Change an entry
      description: |
        Shared entries can be changed by every member; private and "later" ones only by their
        author. Only the author can change who sees an entry.

        With `If-Match`, the change is only made if the entry hasn't changed since the version it
        names, so an edit made offline doesn't overwrite someone else's newer one.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: 'The `updatedAt` of the entry the change is based on, in double quotes, such as `"2026-10-30T08:00:00.123456Z"`.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryFields" }
      responses:
        "200":
          description: The entry after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You can see this entry but not change it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412":
          description: The entry changed since the version in `If-Match`; nothing was changed (code `entry_changed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [entries]
      operationId: deleteEntry
      summary: Delete an entry (same rules as changing it)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You can see this entry but not delete it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entries/{entryId}/done:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    put:
      tags: [entries]
      operationId: completeEntry
      summary: Tick off a reminder
      description: |
        Anyone who can see the reminder can tick it off. A repeating reminder moves on to its next
        due time instead of staying done.
      responses:
        "200":
          description: The reminder after ticking it off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Only reminders can be ticked off (code `not_a_reminder`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [entries]
      operationId: reopenEntry
      summary: Untick a reminder
      responses:
        "200":
          description: The reminder, open again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Only reminders can be ticked off (code `not_a_reminder`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/entries/{entryId}/photos:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    post:
      tags: [entries]
      operationId: addNotePhoto
      summary: Add a photo to a note you can change
      description: |
        A JPEG of at most 5 MB; the app makes photos smaller first. A note holds at most 50. Put
        `![](url)` in the note's text to show it: a photo the text no longer links is deleted with
        the note's next change.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The photo, ready to link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotePhoto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You can see this note but not change it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entries/{entryId}/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/EntryId"
      - name: photoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [entries]
      operationId: getNotePhoto
      summary: A photo in a note you can read
      description: A photo never changes, so the answer may be cached.
      responses:
        "200":
          description: The photo.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/moments:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [moments]
      operationId: listMoments
      summary: One month of the timeline you can see (members only)
      description: |
        Moments and gratitude lines of one month, newest day first: your own plus everyone's shared
        and "later" ones; others' private ones never appear. A "later" moment by someone else carries
        no text or photo until `revealAt` (`sealed` is true). At most 500.
      parameters:
        - name: month
          in: query
          description: "`YYYY-MM`; this month in the household's time zone when absent."
          schema: { $ref: "#/components/schemas/Month" }
      responses:
        "200":
          description: The month.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MomentMonth" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [moments]
      operationId: createMoment
      summary: Keep a moment, or write today's gratitude line
      description: |
        A gratitude line is always for today, in the household's time zone; writing a second one on
        the same day replaces the first. A moment's `day` may lie in the past and is today when
        absent. Only moments can open later (`reveal`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMoment" }
      responses:
        "201":
          description: The moment or line.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/moments/resurfaced:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [moments]
      operationId: getResurfaced
      summary: What comes back today
      description: |
        Moments and lines you can see from this day in earlier years, and one gratitude line from
        more than a week ago, picked at random on every call. Sealed ones are left out.
      responses:
        "200":
          description: Today's look back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resurfaced" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/moments/{momentId}:
    parameters:
      - $ref: "#/components/parameters/MomentId"
    get:
      tags: [moments]
      operationId: getMoment
      summary: One moment or gratitude line
      responses:
        "200":
          description: The moment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [moments]
      operationId: updateMoment
      summary: Change your moment or line
      description: Only its author can change it. A gratitude line keeps its day.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MomentFields" }
      responses:
        "200":
          description: The moment after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You can see it but not change it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [moments]
      operationId: deleteMoment
      summary: Delete your moment or line, with its photo and video
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You can see it but not delete it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/moments/{momentId}/reaction:
    parameters:
      - $ref: "#/components/parameters/MomentId"
    put:
      tags: [moments]
      operationId: reactToMoment
      summary: Answer a moment or line with an emoji
      description: >
        Any member who can read it can react; a new emoji replaces the member's earlier one, and
        its author is told. A "later" moment that hasn't opened yet is not found.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MomentReaction" }
      responses:
        "200":
          description: The moment with its reactions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moment" }
        "400":
          description: The emoji isn't one of the offered ones (code `invalid_reaction`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [moments]
      operationId: unreactToMoment
      summary: Take your emoji off a moment or line
      responses:
        "200":
          description: The moment with its reactions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/moments/{momentId}/photo:
    parameters:
      - $ref: "#/components/parameters/MomentId"
    get:
      tags: [moments]
      operationId: getMomentPhoto
      summary: A moment's photo
      description: Use the moment's `photoUrl`; it changes with the photo, so the answer may be cached.
      parameters:
        - name: v
          in: query
          description: The photo's version, part of `photoUrl`.
          schema: { type: string, maxLength: 40 }
      responses:
        "200":
          description: The photo.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [moments]
      operationId: setMomentPhoto
      summary: Add or replace the photo of your moment
      description: A JPEG of at most 5 MB; the app makes photos smaller first. Gratitude lines have no photo.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The moment with its photo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You can see it but not change it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [moments]
      operationId: deleteMomentPhoto
      summary: Remove the photo of your moment
      responses:
        "200":
          description: The moment without a photo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You can see it but not change it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/moments/{momentId}/video:
    parameters:
      - $ref: "#/components/parameters/MomentId"
    get:
      tags: [moments]
      operationId: getMomentVideo
      summary: A moment's video
      description: |
        Use the moment's `videoUrl`; it changes with the video, so the answer may be cached. Send
        `Range` to stream it: one range comes back as 206, several as the whole video.
      parameters:
        - name: v
          in: query
          description: The video's version, part of `videoUrl`.
          schema: { type: string, maxLength: 40 }
        - name: Range
          in: header
          description: "One byte range, `bytes=from-to`, `bytes=from-` or `bytes=-last`."
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The whole video.
          headers:
            Accept-Ranges:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            video/*:
              schema: { type: string, format: binary }
        "206":
          description: The range asked for.
          headers:
            Accept-Ranges:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
            Content-Range:
              required: true
              schema: { type: string }
          content:
            video/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416":
          description: The range lies outside the video.
          headers:
            Content-Range:
              required: true
              schema: { type: string }
    put:
      tags: [moments]
      operationId: setMomentVideo
      summary: Add or replace the video of your moment
      description: |
        An MP4 or QuickTime video of at most 200 MB, sent as it is. Gratitude lines have no video.
        Videos need the S3 store; without it this answers 503.
      requestBody:
        required: true
        content:
          video/*:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The moment with its video.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You can see it but not change it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [moments]
      operationId: deleteMomentVideo
      summary: Remove the video of your moment
      responses:
        "200":
          description: The moment without a video.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You can see it but not change it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/cook/suggestions:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [cook]
      operationId: suggestRecipes
      summary: Pick recipes from Mealie that fit a mood (members only)
      description: |
        Claude picks up to three recipes from the household's Mealie and says why each fits.
        When Claude can't be reached, three recipes are picked at random instead (`chef` is false).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CookMood" }
      responses:
        "200":
          description: Up to three suggestions; empty when Mealie has no recipes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suggestions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/recipes/{slug}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/RecipeSlug"
    get:
      tags: [cook]
      operationId: getRecipe
      summary: A recipe from Mealie with its ingredients and steps (members only)
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/recipes/{slug}/image:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/RecipeSlug"
    get:
      tags: [cook]
      operationId: getRecipeImage
      summary: A recipe's picture, about 600 pixels wide (members only)
      description: Fetched from Mealie through the API, like everything else from Mealie. 404 when the recipe has none.
      responses:
        "200":
          description: The picture.
          headers:
            Cache-Control: { required: true, schema: { type: string } }
          content:
            image/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/recipes/{slug}/rating:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/RecipeSlug"
    put:
      tags: [cook]
      operationId: rateRecipe
      summary: Rate a dish as you, replacing your earlier rating (members only)
      description: |
        Both of you see each other's ratings. Dishes either of you rated `nope` are left out of
        dinner ideas and the meal plan's suggestions; dishes you loved steer them. Needs Mealie, for
        the dish's name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RatingChoice" }
      responses:
        "200":
          description: Your rating.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealRating" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [cook]
      operationId: unrateRecipe
      summary: Take back your rating of a dish
      responses:
        "204": { description: Removed, or nothing was rated. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/taste:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [cook]
      operationId: getTaste
      summary: How each of you rated the dishes (members only)
      description: Works without Mealie.
      responses:
        "200":
          description: Every rating in the household, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Taste" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/meal-recap:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [cook]
      operationId: getMealRecap
      summary: A year of meal memories (members only)
      description: |
        What you can read of the year's moments that are about a dish: how many, the dishes cooked
        most, the ones you both loved, and the newest with a photo. Works without Mealie.
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer, minimum: 2000, maximum: 9999 }, description: The current year when absent. }
      responses:
        "200":
          description: The recap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealRecap" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/meal-plan:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [cook]
      operationId: getMealPlan
      summary: The household's dinners for some days (members only)
      description: |
        One dinner per day. Days are calendar dates, as the household lives them. Planned dinners
        stay readable when Mealie is down.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 14, default: 7 } }
      responses:
        "200":
          description: The planned dinners from `from` on, by day; days without one are left out.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlannedMeal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/meal-plan/{day}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - { name: day, in: path, required: true, schema: { type: string, format: date } }
    put:
      tags: [cook]
      operationId: planMeal
      summary: Make a recipe the day's dinner, replacing what was planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealChoice" }
      responses:
        "200":
          description: The planned dinner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedMeal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [cook]
      operationId: unplanMeal
      summary: Take the day's dinner off the plan
      responses:
        "204": { description: Removed, or nothing was planned. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/meal-plan/suggestions:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [cook]
      operationId: suggestMealPlan
      summary: Ideas for the days without a dinner (members only)
      description: |
        Claude picks one recipe for each unplanned day, different from each other, from what is
        planned and from the dinners of the last three weeks. It favours what is on hand: the
        `wish`, and what was ticked off the shopping list. Nothing is planned until a member
        accepts an idea with planMeal. Without Claude the ideas are random (`chef` is false).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealPlanWish" }
      responses:
        "200":
          description: One idea per unplanned day, by day; empty when every day is planned or Mealie has no recipes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealIdeas" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/meal-plan/shopping-list:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [cook]
      operationId: addMealPlanToShoppingList
      summary: Put the chosen ingredients of several recipes on the shopping list at once
      description: Each item notes the recipe it is for and goes to its aisle, like addToShoppingList.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMealsToShoppingList" }
      responses:
        "200":
          description: What was added, and to which list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingListAdded" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/shopping-list:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [shopping]
      operationId: listShoppingItems
      summary: The household's shared shopping list (members only)
      description: Open items oldest first, then ticked ones, most recently ticked first. At most 500.
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShoppingItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [cook]
      operationId: addToShoppingList
      summary: Put a recipe's missing ingredients on the household's shopping list (members only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddToShoppingList" }
      responses:
        "200":
          description: What was added, and to which list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingListAdded" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/shopping-list/items:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [shopping]
      operationId: addShoppingItem
      summary: Put something on the shopping list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewShoppingItem" }
      responses:
        "201":
          description: The new item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/shopping-list/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ShoppingItemId"
    patch:
      tags: [shopping]
      operationId: updateShoppingItem
      summary: Move an item to another aisle
      description: The household remembers it, so the same thing goes to that aisle from now on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShoppingItemUpdate" }
      responses:
        "200":
          description: The item, moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [shopping]
      operationId: deleteShoppingItem
      summary: Take an item off the list
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/shopping-list/items/{itemId}/done:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ShoppingItemId"
    put:
      tags: [shopping]
      operationId: tickShoppingItem
      summary: Tick an item off
      responses:
        "200":
          description: The item, ticked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [shopping]
      operationId: untickShoppingItem
      summary: Untick an item
      responses:
        "200":
          description: The item, open again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/shopping-list/suggestions:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [shopping]
      operationId: listShoppingSuggestions
      summary: Things you put on the shopping list before (members only)
      description: |
        What the household has put on the list, most often first, then most recently, including
        items since cleared. Items open on the list are left out. At most 20.
      responses:
        "200":
          description: The suggestions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TitleSuggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/shopping-list/done:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    delete:
      tags: [shopping]
      operationId: clearShoppingItems
      summary: Remove every ticked item
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/bucket:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [bucket]
      operationId: listBucket
      summary: The household's someday list (members only)
      description: |
        Things to watch, read or visit some day. Open items oldest first, then ticked ones, most
        recently ticked first. At most 500.
      parameters:
        - name: kind
          in: query
          required: false
          description: Only items of this kind.
          schema: { $ref: "#/components/schemas/BucketKind" }
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BucketItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [bucket]
      operationId: addBucketItem
      summary: Wish for something
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewBucketItem" }
      responses:
        "201":
          description: The new item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/bucket/{itemId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/BucketItemId"
    delete:
      tags: [bucket]
      operationId: deleteBucketItem
      summary: Take a item off the list
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/bucket/{itemId}/done:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/BucketItemId"
    put:
      tags: [bucket]
      operationId: tickBucketItem
      summary: Tick a item off (watched, read, been there)
      responses:
        "200":
          description: The item, ticked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [bucket]
      operationId: untickBucketItem
      summary: Open a item again
      responses:
        "200":
          description: The item, open again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/expenses:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [budget]
      operationId: listExpenses
      summary: One month of expenses and settlements (members only)
      description: Newest day first. At most 1000.
      parameters:
        - name: month
          in: query
          description: "`YYYY-MM`; this month in the household's time zone when absent."
          schema: { $ref: "#/components/schemas/Month" }
      responses:
        "200":
          description: The month.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseMonth" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [budget]
      operationId: createExpense
      summary: Add an expense
      description: Without `shares` it is split evenly between all members; the first members carry odd cents.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseFields" }
      responses:
        "201":
          description: The expense.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ExpenseId"
    put:
      tags: [budget]
      operationId: updateExpense
      summary: Change an expense
      description: Every member may. A settlement can't be changed (`409 settlement_fixed`); delete it and settle again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseFields" }
      responses:
        "200":
          description: The expense.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: It is a settlement (code `settlement_fixed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [budget]
      operationId: deleteExpense
      summary: Delete an expense or a settlement
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/expenses/{expenseId}/receipt:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ExpenseId"
    get:
      tags: [budget]
      operationId: getExpenseReceipt
      summary: The photo of an expense's receipt
      description: Use the expense's `receiptUrl`; it changes with the photo, so the answer may be cached.
      parameters:
        - name: v
          in: query
          description: The photo's version, part of `receiptUrl`.
          schema: { type: string, maxLength: 40 }
      responses:
        "200":
          description: The photo.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      tags: [budget]
      operationId: setExpenseReceipt
      summary: Add or replace the photo of an expense's receipt
      description: A JPEG of at most 5 MB, kept in S3; `503 receipts_unavailable` when S3 isn't set up or reachable.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The expense with its receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [budget]
      operationId: deleteExpenseReceipt
      summary: Remove the photo of an expense's receipt
      responses:
        "200":
          description: The expense without a receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/trips:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [trips]
      operationId: listTrips
      summary: The household's trips with their options, votes and packing lists (members only)
      description: Soonest start first; trips without dates last. At most 50.
      responses:
        "200":
          description: The trips.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [trips]
      operationId: createTrip
      summary: Start planning a trip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripFields" }
      responses:
        "201":
          description: The new trip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TripFull" }

  /v1/households/{householdId}/trips/{tripId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/TripId"
    put:
      tags: [trips]
      operationId: updateTrip
      summary: Change a trip, or decide on one of its options
      description: Trips are shared, so every member can change them. `chosenOptionId` must be one of the trip's options.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripFields" }
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [trips]
      operationId: deleteTrip
      summary: Delete a trip with its options, photos and packing list
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/trips/{tripId}/options:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/TripId"
    post:
      tags: [trips]
      operationId: addTripOption
      summary: Add a place or plan to weigh up (at most 20 per trip)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripOptionFields" }
      responses:
        "201":
          description: The trip with the new option.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TripFull" }

  /v1/households/{householdId}/trips/{tripId}/options/{optionId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/TripId"
      - $ref: "#/components/parameters/OptionId"
    put:
      tags: [trips]
      operationId: updateTripOption
      summary: Change an option
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripOptionFields" }
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [trips]
      operationId: deleteTripOption
      summary: Remove an option with its photos and votes
      responses:
        "200":
          description: The trip without the option.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/trips/{tripId}/options/{optionId}/vote:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/TripId"
      - $ref: "#/components/parameters/OptionId"
    put:
      tags: [trips]
      operationId: voteTripOption
      summary: Make this option your favourite of the trip
      description: Each member has one favourite per trip; this moves yours here.
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/trips/{tripId}/vote:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/TripId"
    delete:
      tags: [trips]
      operationId: unvoteTrip
      summary: Take back your favourite of the trip
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/trips/{tripId}/options/{optionId}/photos:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/TripId"
      - $ref: "#/components/parameters/OptionId"
    post:
      tags: [trips]
      operationId: addTripPhoto
      summary: Add a photo to an option
      description: A JPEG of at most 5 MB, kept in S3, at most 12 per option; `503 photos_unavailable` when S3 isn't set up or reachable.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The trip with the photo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TripFull" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/trips/{tripId}/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/TripId"
      - $ref: "#/components/parameters/PhotoId"
    get:
      tags: [trips]
      operationId: getTripPhoto
      summary: A photo of an option
      description: Use the photo's `url`; a photo never changes, so the answer may be cached.
      responses:
        "200":
          description: The photo.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [trips]
      operationId: deleteTripPhoto
      summary: Remove a photo
      responses:
        "200":
          description: The trip without the photo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/trips/{tripId}/packing:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/TripId"
    post:
      tags: [trips]
      operationId: addPackingItem
      summary: Add something to pack (at most 200 per trip)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackingFields" }
      responses:
        "201":
          description: The trip with the new item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TripFull" }

  /v1/households/{householdId}/trips/{tripId}/packing/{itemId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/TripId"
      - $ref: "#/components/parameters/PackingItemId"
    put:
      tags: [trips]
      operationId: updatePackingItem
      summary: Change or tick off something to pack
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackingFields" }
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [trips]
      operationId: deletePackingItem
      summary: Remove something from the packing list
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/balance:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [budget]
      operationId: getBalance
      summary: Where everyone stands, and the payments that settle it (members only)
      responses:
        "200":
          description: The balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/settlements:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [budget]
      operationId: settleUp
      summary: Record that one member paid another back
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSettlement" }
      responses:
        "201":
          description: The settlement, as an expense of kind `settlement`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/wishes:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [wishes]
      operationId: listWishes
      summary: The household's wishlist (members only)
      description: The most wanted first (the sum of everyone's hearts); wishes that came true come last. At most 500.
      responses:
        "200":
          description: The wishes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Wish" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [wishes]
      operationId: createWish
      summary: Add a wish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WishFields" }
      responses:
        "201":
          description: The new wish.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wish" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/wishes/{wishId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/WishId"
    put:
      tags: [wishes]
      operationId: updateWish
      summary: Change a wish
      description: The wishlist is shared, so every member can change it. Hearts and the photo stay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WishFields" }
      responses:
        "200":
          description: The wish.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wish" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [wishes]
      operationId: deleteWish
      summary: Delete a wish and its photo
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/wishes/{wishId}/vote:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/WishId"
    put:
      tags: [wishes]
      operationId: voteWish
      summary: Say how much you want it
      description: Your hearts replace the ones you gave before.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hearts]
              properties:
                hearts: { type: integer, minimum: 1, maximum: 3 }
      responses:
        "200":
          description: The wish.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wish" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [wishes]
      operationId: unvoteWish
      summary: Take your hearts back
      responses:
        "200":
          description: The wish.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wish" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/wishes/{wishId}/got:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/WishId"
    put:
      tags: [wishes]
      operationId: gotWish
      summary: The wish came true
      responses:
        "200":
          description: The wish, with `gotAt`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wish" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [wishes]
      operationId: ungotWish
      summary: Make it a wish again
      responses:
        "200":
          description: The wish, without `gotAt`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wish" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/wishes/{wishId}/photo:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/WishId"
    get:
      tags: [wishes]
      operationId: getWishPhoto
      summary: The photo of a wish
      description: Use the wish's `photoUrl`; it changes with the photo, so the answer may be cached.
      parameters:
        - name: v
          in: query
          description: The photo's version, part of `photoUrl`.
          schema: { type: string, maxLength: 40 }
      responses:
        "200":
          description: The photo.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      tags: [wishes]
      operationId: setWishPhoto
      summary: Add or replace the photo of a wish
      description: A JPEG of at most 5 MB, kept in S3; `503 wish_photos_unavailable` when S3 isn't set up or reachable.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The wish with its photo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wish" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [wishes]
      operationId: deleteWishPhoto
      summary: Remove the photo of a wish
      responses:
        "200":
          description: The wish without a photo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wish" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/chores:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [chores]
      operationId: listChores
      summary: The household's chores still to do (members only)
      description: Soonest due first; overdue ones are due before today. A one-off chore leaves the list once done. At most 200.
      responses:
        "200":
          description: The chores.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Chore" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [chores]
      operationId: createChore
      summary: Set up a chore
      description: A rotating chore without `assigneeId` starts with you.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChoreFields" }
      responses:
        "201":
          description: The new chore.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chore" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/chores/{choreId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ChoreId"
    put:
      tags: [chores]
      operationId: updateChore
      summary: Change a chore
      description: Chores are shared, so every member can change them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChoreFields" }
      responses:
        "200":
          description: The chore.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chore" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [chores]
      operationId: deleteChore
      summary: Delete a chore
      description: What was done stays in the history and the tally.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/chores/{choreId}/done:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ChoreId"
    post:
      tags: [chores]
      operationId: completeChore
      summary: Tick a chore off as done by you
      description: |
        A repeating chore moves to its next day after today or its due day, whichever is later; a
        one-off is done. A rotating chore becomes the turn of the member after you, in the order
        they joined. Once a day per chore.
      responses:
        "201":
          description: What was done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChoreCompletion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Done already today, or a one-off done before (code `chore_done`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/households/{householdId}/documents:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Your documents and those shared with the household (members only)
      description: |
        Newest first. A document is private to whoever added it until they share it; other
        members never see a private one. At most 500.
      responses:
        "200":
          description: The documents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [documents]
      operationId: addDocument
      summary: Put a file in your documents
      description: |
        Send the file as the body, with its own `Content-Type`: a PDF, a JPEG, PNG, WebP or HEIC
        image, plain text or CSV, or a Word, Excel, PowerPoint or OpenDocument file, of at most
        50 MB. It starts private to you. Documents need the S3 store; without it this answers 503.
      parameters:
        - name: name
          in: query
          required: true
          description: The file's name, such as `lease.pdf`.
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The new document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/DocumentId"
    patch:
      tags: [documents]
      operationId: updateDocument
      summary: Rename a document or share it with the household
      description: Only the member who added it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentChange" }
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You can see it but not change it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document and its file
      description: Only the member who added it.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You can see it but not delete it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/documents/{documentId}/file:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [documents]
      operationId: getDocumentFile
      summary: The file itself
      description: |
        PDFs and images open in the browser; everything else downloads. The answer is private to
        the viewer and never cached by shared caches.
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/chore-completions:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [chores]
      operationId: listChoreCompletions
      summary: What was done in the last six weeks (members only)
      description: Newest first, also of chores deleted since. At most 300.
      responses:
        "200":
          description: The history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChoreCompletion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/chore-completions/{completionId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/CompletionId"
    delete:
      tags: [chores]
      operationId: undoChoreCompletion
      summary: Take back that you did a chore
      description: Only your own, and only the chore's latest; the chore goes back to its day and turn before.
      responses:
        "204": { description: Undone. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Someone else did it (code `not_yours`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The chore was done again since (code `chore_not_latest`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/households/{householdId}/chore-completions/{completionId}/thanks:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/CompletionId"
    post:
      tags: [chores]
      operationId: thankChoreCompletion
      summary: Say thanks for a chore someone did
      description: |
        Whoever did it hears it, the first time you say it. With `gratitude`, the line also becomes
        your gratitude line for today, shared, unless you wrote one already today.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChoreThanks" }
      responses:
        "200":
          description: The completion, and the gratitude line if one was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChoreThanked" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: You did it yourself (code `own_chore`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/households/{householdId}/chore-fairness:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [chores]
      operationId: getChoreFairness
      summary: Who did how much this week and this month (members only)
      description: Points and chores done per current member, the week from Monday, in the household's time zone.
      responses:
        "200":
          description: The tallies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChoreFairness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/home:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [home]
      operationId: getHome
      summary: Rooms, scenes, lights and readings from Home Assistant, read live (members only)
      description: |
        Only scenes and lights can be switched. Readings (temperature, open windows and the like)
        are read-only; locks, alarms, covers and everything else are never exposed.
        Each member connects their own Home Assistant account, and switches act as that person.
        Rooms are Home Assistant's areas; an entity's `room` is its area, or its device's. Entities
        that belong to a group helper, or that are hidden in Home Assistant, are left out, so a
        group shows as one control. If the areas can't be read, `rooms` is empty and nothing has a
        `room`. Until the caller has connected, `connected` is false and the lists are empty.
      responses:
        "200":
          description: The home.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/home/connection:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [home]
      operationId: connectHome
      summary: Start connecting your Home Assistant account
      description: |
        Returns Home Assistant's sign-in page. Send the browser there (a navigation, not a fetch);
        it comes back through `/auth/homeassistant/callback`.
      responses:
        "200":
          description: Where to sign in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeConnect" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [home]
      operationId: disconnectHome
      summary: Disconnect your Home Assistant account and revoke its token
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/watch:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [watch]
      operationId: getWatchShelf
      summary: The movie and series libraries you can watch in Plex (members only)
      description: |
        Each member connects their own Plex account and sees the libraries on their own servers and
        on servers friends share with them, with their own watched state. A server that can't be
        reached is left out. Until the caller has connected, `connected` is false and `libraries`
        is empty. Libraries the caller left out are listed with `included: false`. Read-only:
        nothing is played or changed in Plex.
      responses:
        "200":
          description: The libraries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchShelf" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/watch/connection:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [watch]
      operationId: connectWatch
      summary: Start connecting your Plex account
      description: |
        Returns Plex's sign-in page. Send the browser there (a navigation, not a fetch); once you
        allow Homeloom it comes back through `/auth/plex/callback`.
      responses:
        "200":
          description: Where to sign in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectURL" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [watch]
      operationId: disconnectWatch
      summary: Disconnect your Plex account; Homeloom forgets its token
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/watch/suggestions:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [watch]
      operationId: suggestWatch
      summary: Ideas for what to watch, picked by Claude (members only)
      description: |
        With Plex connected, Claude picks mostly from what the caller hasn't seen in their
        libraries, taking what they have watched as their taste, and adds one or two titles from
        outside them. Without Plex, every idea is from outside. Ideas from a library carry `title`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchMood" }
      responses:
        "200":
          description: Up to four ideas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchIdeas" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/places:
    get:
      tags: [places]
      operationId: searchPlaces
      summary: Towns and cities matching what is typed, for autocompletion
      description: |
        Up to five matches, most populous first, with names in the caller's language. Fewer than two
        characters match nothing. A match's `label` is the text to keep as the place: the weather
        lookup finds the same town again from it. When the search is down the answer is 503 and the
        client lets people type the place.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: The matches, possibly none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlaceMatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/date-night/ideas:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [date-night]
      operationId: suggestDateNight
      summary: Ideas for an evening together, from the weather, what's on, a budget and a mood (members only)
      description: |
        Claude suggests a few evenings out or in for the day asked for. With a `place` it looks up
        the forecast and events happening there; both are best effort, and the ideas still come
        without them (`forecast` is then absent). Each idea carries a start time, so a client can
        save the chosen one as a calendar event with `createEntry`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DateNightRequest" }
      responses:
        "200":
          description: Up to three ideas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DateNight" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/watch/tonight:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [watch]
      operationId: getWatchTonight
      summary: What the household picked to watch tonight (members only)
      description: |
        A pick lasts until 5 a.m. the morning after, in the household's time zone. Members who
        haven't connected Plex, or can't reach the title, still see it.
      responses:
        "200":
          description: Tonight's pick, if there is one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchTonight" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [watch]
      operationId: pickWatchTonight
      summary: Pick one of your titles for tonight; the other members are told
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchTonightChoice" }
      responses:
        "200":
          description: The pick.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TonightPick" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [watch]
      operationId: clearWatchTonight
      summary: Forget tonight's pick
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/watch/night:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [watch]
      operationId: getWatchNight
      summary: Your movie night - films to swipe on and the ones you both like (members only)
      description: |
        Unseen movies from your own libraries, shuffled; those your partner already liked come
        first. Swipes last until 5 a.m. the morning after. A film is the same film across Plex
        accounts when name and year agree.
      responses:
        "200":
          description: The deck and the matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchNight" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [watch]
      operationId: resetWatchNight
      summary: Start movie night over - forget everyone's swipes
      responses:
        "204": { description: Forgotten. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/watch/night/swipes:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [watch]
      operationId: swipeWatchNight
      summary: Say whether you would watch one of your movies; a match tells your partner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchSwipe" }
      responses:
        "200":
          description: Recorded. `match` is set when your partner liked the same film.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchSwipeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/watch/libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - { name: libraryId, in: path, required: true, schema: { $ref: "#/components/schemas/MediaId" } }
    put:
      tags: [watch]
      operationId: setWatchLibrary
      summary: Include one of your libraries, or leave it out
      description: |
        Your own choice: a library you leave out isn't offered on your shelf or used for ideas.
        Every library is included until you leave it out, so new ones show up on their own.
        Nothing changes in Plex. Disconnecting forgets the choice.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchLibrarySetting" }
      responses:
        "204": { description: Saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/watch/libraries/{libraryId}/titles:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - { name: libraryId, in: path, required: true, schema: { $ref: "#/components/schemas/MediaId" } }
    get:
      tags: [watch]
      operationId: listWatchTitles
      summary: Every movie or series in one of your libraries
      responses:
        "200":
          description: The titles, in the library's order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WatchTitle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/watch/titles/{titleId}/poster:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - { name: titleId, in: path, required: true, schema: { $ref: "#/components/schemas/MediaId" } }
    get:
      tags: [watch]
      operationId: getWatchPoster
      summary: A title's poster, about 342 by 513 pixels
      description: Fetched from Plex through the API, so the Plex token never reaches the client.
      responses:
        "200":
          description: The poster.
          headers:
            Cache-Control: { required: true, schema: { type: string } }
          content:
            image/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/home/scenes/{sceneId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: sceneId
        in: path
        required: true
        schema: { type: string, pattern: "^scene\\.[a-z0-9_]{1,100}$" }
    post:
      tags: [home]
      operationId: activateScene
      summary: Turn a scene on
      responses:
        "204": { description: The scene is on. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/home/lights/{lightId}/toggle:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: lightId
        in: path
        required: true
        schema: { type: string, pattern: "^light\\.[a-z0-9_]{1,100}$" }
    post:
      tags: [home]
      operationId: toggleLight
      summary: Switch a light on or off
      responses:
        "200":
          description: The light after switching; `room` is left out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Light" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/calls:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [calls]
      operationId: startCall
      summary: Start a voice and video call with other members (members only)
      description: |
        Opens a new call, returns a LiveKit access token for it (valid for ten minutes to connect)
        and rings the members in `invite` with a push notification that opens
        `/call/<callId>?from=<caller's id>`. Answers `503 calls_unavailable` when LiveKit isn't set
        up or can't be reached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallInvite" }
      responses:
        "201":
          description: The call, and the token to connect with.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/calls/homeloom:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [calls]
      operationId: talkToHomeloom
      summary: Start a voice call with Homeloom (members only)
      description: |
        Starts a private call with the Homeloom voice agent, which can use the assistant's tools as
        the caller and speaks the request's language. Nobody else can join it. Answers `503
        calls_unavailable` when calls or the voice agent aren't set up.
      responses:
        "201":
          description: The call, and the token to connect with.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/calls/{callId}/join:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: joinCall
      summary: Join or answer one of the household's calls (members only)
      responses:
        "200":
          description: The token to connect with.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/calls/{callId}/invites:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: inviteToCall
      summary: Ring more members into a call (members only)
      description: Members already in the call aren't rung.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallInvite" }
      responses:
        "204": { description: Rung. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/calls/{callId}/guest-links:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: createGuestLink
      summary: Make a link that lets someone without an account into the call (members only)
      description: |
        Share it as `PUBLIC_URL/guest/<token>`. It works for 12 hours and only for this call. The
        first device that joins with it claims it and can come back; others get `409
        guest_link_used`. Only hashes of the token and the device are stored.
      responses:
        "201":
          description: The new link's token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/guest-calls/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{20,100}$" }
    get:
      tags: [calls]
      operationId: getGuestCall
      summary: Who invited the holder of a guest link (no sign-in)
      security: []
      responses:
        "200":
          description: The link works.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestCall" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [calls]
      operationId: joinGuestCall
      summary: Join a call through a guest link (no sign-in)
      description: |
        `device` is a random id the browser keeps for this link. The first device claims the link;
        another one gets `409 guest_link_used`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestJoin" }
      responses:
        "200":
          description: The token to connect with.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Another device already uses this link (code `guest_link_used`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/push:
    get:
      tags: [push]
      operationId: getPushConfig
      summary: The VAPID public key to subscribe with
      description: |
        Pass `publicKey` as `applicationServerKey` to `PushManager.subscribe`. Answers `503
        push_unavailable` when the server has no VAPID keys, so the app can hide the switch.
      responses:
        "200":
          description: Push is set up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/push/subscriptions:
    post:
      tags: [push]
      operationId: subscribePush
      summary: Get notifications on this device
      description: |
        Stores the browser's push subscription for the caller; sending the same endpoint again
        updates it. Notifications are written in the request's language. Only the push services
        of Apple, Google, Mozilla and Microsoft are accepted as endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscription" }
      responses:
        "204": { description: Subscribed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [push]
      operationId: unsubscribePush
      summary: Stop notifications on this device
      parameters:
        - name: endpoint
          in: query
          required: true
          schema: { type: string, maxLength: 2048 }
      responses:
        "204": { description: Unsubscribed, or was not subscribed. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/push/topics:
    get:
      tags: [push]
      operationId: listPushTopics
      summary: Which kinds of notification you get
      description: |
        Every topic with whether you get it. The choice is yours and applies to all your devices;
        a topic you switched off is skipped before anything is sent.
      responses:
        "200":
          description: All topics, in the order to show them.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PushTopic" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/push/topics/{topic}:
    put:
      tags: [push]
      operationId: setPushTopic
      summary: Switch one kind of notification on or off
      parameters:
        - name: topic
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PushTopicName" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/households/{householdId}/conversations:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [assistant]
      operationId: listConversations
      summary: Your chats with the assistant in this household, last used first
      description: Only you see your conversations. `503 assistant_unavailable` when no LLM is set up.
      responses:
        "200":
          description: Up to 30 conversations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/chat:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [assistant]
      operationId: chat
      summary: Ask the assistant; the answer streams back as server-sent events
      description: |
        Stores your message, in a new conversation unless `conversationId` is given, and streams the
        answer as `text/event-stream`. The assistant acts only as you, through the same rules as the
        rest of the API: it reads and adds reminders, events and notes you can see, finds recipes,
        reads and adds to the shopping list, adds expenses and reads the money, and reads the home and switches its scenes and lights.
        It can't delete anything.

        Events, each with a JSON `data` line:
        - `conversation`: a `Conversation`, first.
        - `tool`: a `ChatTool`, when the assistant starts to use a tool.
        - `text`: a `ChatText`, the next piece of the answer.
        - `done`: the stored answer, a `ChatMessage`; the stream then ends.
        - `error`: an `Error` (e.g. `assistant_unavailable`) when the answer fails after the stream
          has started; the stream then ends. Your message stays stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: The answer, as server-sent events.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [assistant]
      operationId: getConversation
      summary: One of your conversations with its last 40 messages, oldest first
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [assistant]
      operationId: deleteConversation
      summary: Delete one of your conversations
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/households/{householdId}/mcp-tokens:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [assistant]
      operationId: listMcpTokens
      summary: Your keys and passwords for other apps
      responses:
        "200":
          description: Your keys and passwords in this household, newest first; the secrets are only shown when made.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/McpToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [assistant]
      operationId: createMcpToken
      summary: Make a key or password for another app
      description: |
        With `access: tools` (the default) the secret is a key: an assistant sends it as
        `Authorization: Bearer <secret>` to `/mcp`. With `access: calendar` it is a password for a
        calendar app, which syncs your events and reminders over CalDAV at `/dav`; with
        `access: notes` it is a password for a notes app, which syncs your notes as files over
        WebDAV at `/webdav` (any user name for both). Each acts as you in this household, opens
        only what it was made for, and works until you delete it. Only a hash of it is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpTokenRequest" }
      responses:
        "201":
          description: The new token with its secret, shown this once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpTokenCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/households/{householdId}/calendar-profile:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [assistant]
      operationId: createCalendarProfile
      summary: Make a calendar password and an iPhone profile that adds it as a CalDAV account
      description: |
        Makes a password like `createMcpToken` with `access: calendar` and returns it inside an
        Apple configuration profile for the server, so installing the profile sets up Calendar and
        Reminders. Sent as a form so the browser navigates to it and iOS offers to install it. The
        password is in the response only; remove it like any other.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60, description: Which device it is for. }
      responses:
        "200":
          description: The configuration profile.
          content:
            application/x-apple-aspen-config:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/mcp-tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [assistant]
      operationId: deleteMcpToken
      summary: Delete one of your tokens; the app loses access at once
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MomentId:
      name: momentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CallId:
      name: callId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BucketItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShoppingItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GiftIdeaId:
      name: ideaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionId:
      name: optionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackingItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChoreId:
      name: choreId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WishId:
      name: wishId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CompletionId:
      name: completionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecipeSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,200}$" }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by authentik.
    cookieAuth:
      type: apiKey
      in: cookie
      name: homeloom_session
      description: Session cookie set by `/auth/callback`.

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or not visible to the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TripFull:
      description: That list has reached its limit (code `trip_full`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Unavailable:
      description: A dependency (authentik, Redis, Mealie, Home Assistant, Web Push, the LLM, LiveKit) cannot be reached or isn't set up.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found, description: Stable machine-readable code. }
        message: { type: string, description: Human-readable message in the negotiated language. }
        detail: { type: string, description: Optional technical detail, English only, for logs and debugging. }

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 0.1.0, description: Release version of the running API. }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { type: string }
          example: { postgres: ok, redis: ok }

    Invite:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string, description: "Share as `<PUBLIC_URL>/join/<code>`." }
        expiresAt: { type: string, format: date-time }

    AskQuestion:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 280 }

    QuestionSuggestions:
      type: object
      required: [questions]
      properties:
        questions: { type: array, items: { type: string } }

    AnswerQuestion:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }

    Question:
      type: object
      required: [id, text, askedBy, createdAt, revealed, answers]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        askedBy: { type: string, format: uuid, description: User id of the member who asked. }
        createdAt: { type: string, format: date-time }
        revealed: { type: boolean, description: True once every member has answered; answers are then visible to all and fixed. }
        revealedAt: { type: string, format: date-time }
        answers:
          type: array
          items: { $ref: "#/components/schemas/Answer" }

    Answer:
      type: object
      required: [userId, answeredAt]
      properties:
        userId: { type: string, format: uuid }
        text: { type: string, description: Present for your own answer, and for everyone's once the question is revealed. }
        answeredAt: { type: string, format: date-time }

    EntryKind:
      type: string
      enum: [event, note, reminder]

    Visibility:
      type: string
      enum: [private, shared, reveal]
      description: |
        `private`: only the author. `shared`: every member. `reveal`: every member sees that it
        exists, but its text opens only at `revealAt` (notes and moments only).

    Repeat:
      type: string
      enum: [never, daily, weekly, monthly, yearly]

    EntryFields:
      type: object
      required: [text, visibility]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000, description: "A note's Markdown text, or a reminder's or event's title (at most 200 characters). A note's title is its first line, usually a `# Heading`." }
        visibility: { $ref: "#/components/schemas/Visibility" }
        revealAt: { type: string, format: date-time, description: "When a `reveal` note opens; required for it." }
        dueAt: { type: string, format: date-time, description: "Reminders only: when it is due; a notification goes out then. Ignored for events, which say when their alert goes out." }
        startsAt: { type: string, format: date-time, description: Events only, required for them. For an all-day event any time on its first day. }
        endsAt: { type: string, format: date-time, description: "Events only: not before `startsAt`. For an all-day event any time on its last day; absent for one day." }
        allDay: { type: boolean, description: Events only. }
        alertMinutes: { type: integer, minimum: 0, maximum: 10080, description: "Events only: a notification goes out this many minutes before the start (for all-day events, before midnight)." }
        repeat: { $ref: "#/components/schemas/Repeat" }
        assigneeId: { type: string, format: uuid, description: "Shared reminders only: the member it is for. Absent means everyone." }
        bill: { $ref: "#/components/schemas/Bill" }

    CreateEntry:
      allOf:
        - $ref: "#/components/schemas/EntryFields"
        - type: object
          required: [kind]
          properties:
            kind: { $ref: "#/components/schemas/EntryKind" }

    Entry:
      type: object
      required: [id, kind, authorId, visibility, sealed, allDay, repeat, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/EntryKind" }
        authorId: { type: string, format: uuid }
        visibility: { $ref: "#/components/schemas/Visibility" }
        revealAt: { type: string, format: date-time }
        sealed: { type: boolean, description: True while you may not read the text yet; `text` is then absent. }
        text: { type: string }
        title: { type: string, description: "Notes only: the first line of the text without its Markdown, such as a `# Heading`'s words. Absent while `sealed`." }
        dueAt: { type: string, format: date-time, description: "A reminder's due time, or when an event's next alert goes out." }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        allDay: { type: boolean }
        alertMinutes: { type: integer }
        repeat: { $ref: "#/components/schemas/Repeat" }
        assigneeId: { type: string, format: uuid }
        bill: { $ref: "#/components/schemas/Bill" }
        doneAt: { type: string, format: date-time }
        doneBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NotePhoto:
      type: object
      required: [id, url]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, description: "Where the photo is, to link in the note's text as `![](url)`." }

    MomentKind:
      type: string
      enum: [moment, gratitude]

    Month:
      type: string
      pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      example: 2026-10

    MomentFields:
      type: object
      required: [text, visibility]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000, description: "A moment's text, or a gratitude line (at most 200 characters)." }
        visibility: { $ref: "#/components/schemas/Visibility" }
        revealAt: { type: string, format: date-time, description: "When a `reveal` moment opens; required for it." }
        day: { type: string, format: date, description: "Moments only: the day it happened, not after today. Today when absent." }
        meal: { $ref: "#/components/schemas/MealRef", description: "Moments only: the dish it is about, which makes it a meal memory. Absent for any other moment." }

    MealRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, maxLength: 200 }
        name: { type: string, maxLength: 200 }

    CreateMoment:
      allOf:
        - $ref: "#/components/schemas/MomentFields"
        - type: object
          required: [kind]
          properties:
            kind: { $ref: "#/components/schemas/MomentKind" }

    Moment:
      type: object
      required: [id, kind, authorId, day, visibility, sealed, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/MomentKind" }
        authorId: { type: string, format: uuid }
        day: { type: string, format: date }
        visibility: { $ref: "#/components/schemas/Visibility" }
        revealAt: { type: string, format: date-time }
        sealed: { type: boolean, description: "True while you may not read it yet; `text`, `photoUrl` and `videoUrl` are then absent." }
        text: { type: string }
        photoUrl: { type: string, description: Where its photo is, if it has one. }
        videoUrl: { type: string, description: Where its video is, if it has one. }
        meal: { $ref: "#/components/schemas/MealRef", description: "The dish it is about, if it is a meal memory; absent while sealed." }
        reactions:
          type: array
          description: What members answered it with, oldest first; one per member.
          items: { $ref: "#/components/schemas/GivenReaction" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GivenReaction:
      type: object
      required: [userId, emoji]
      properties:
        userId: { type: string, format: uuid }
        emoji: { type: string }

    MomentReaction:
      type: object
      required: [emoji]
      properties:
        emoji: { type: string, enum: ["❤️", "😂", "🥹", "🙌", "👍"] }

    MomentMonth:
      type: object
      required: [month, moments]
      properties:
        month: { $ref: "#/components/schemas/Month" }
        moments:
          type: array
          items: { $ref: "#/components/schemas/Moment" }
        earlier: { $ref: "#/components/schemas/Month", description: "The latest earlier month with something you can see; absent when there is none." }

    Resurfaced:
      type: object
      required: [onThisDay]
      properties:
        onThisDay:
          type: array
          items: { $ref: "#/components/schemas/Moment" }
        gratitude: { $ref: "#/components/schemas/Moment" }

    CalendarFeedState:
      type: object
      required: [active]
      properties:
        active: { type: boolean }

    CalendarFeedLink:
      type: object
      required: [path]
      properties:
        path: { type: string, description: "The feed's path, e.g. /v1/calendar-feeds/<token>. Shown once." }

    CookMood:
      type: object
      required: [mood]
      properties:
        mood: { type: string, minLength: 1, maxLength: 200, description: "In your own words, e.g. \"cozy, something with mushrooms\"." }

    Suggestions:
      type: object
      required: [suggestions, chef]
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/Suggestion" }
        chef: { type: boolean, description: True when Claude picked; false for the random fallback. }

    Suggestion:
      type: object
      required: [recipe]
      properties:
        recipe: { $ref: "#/components/schemas/RecipeSummary" }
        reason: { type: string, description: Why it fits the mood, in the request's language. Absent for random picks. }

    RecipeSummary:
      type: object
      required: [slug, name, tags]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        totalTime: { type: string, description: As written in Mealie, e.g. "45 Minuten". }
        tags:
          type: array
          items: { type: string }
        imageUrl: { type: string, description: "The recipe's picture (getRecipeImage), versioned; absent when it has none." }

    Recipe:
      type: object
      required: [slug, name, tags, ingredients, steps]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        totalTime: { type: string }
        imageUrl: { type: string, description: "The recipe's picture (getRecipeImage), versioned; absent when it has none." }
        servings: { type: string }
        tags:
          type: array
          items: { type: string }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        steps:
          type: array
          items: { type: string }
        mealieUrl: { type: string, description: The recipe in Mealie. }

    Ingredient:
      type: object
      required: [id, text]
      properties:
        id: { type: string, description: Mealie's reference id; pass it to addToShoppingList. }
        text: { type: string }

    AddToShoppingList:
      type: object
      required: [recipe, ingredientIds]
      properties:
        recipe: { type: string, pattern: "^[A-Za-z0-9_-]{1,200}$", description: The recipe's slug. }
        ingredientIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, maxLength: 100 }

    PlannedMeal:
      type: object
      required: [day, recipe, plannedBy]
      properties:
        day: { type: string, format: date }
        recipe: { $ref: "#/components/schemas/RecipeSummary" }
        plannedBy: { type: string, format: uuid, description: The member who planned it. }

    MealChoice:
      type: object
      required: [recipe]
      properties:
        recipe: { type: string, pattern: "^[A-Za-z0-9_-]{1,200}$", description: The recipe's slug. }

    MealPlanWish:
      type: object
      required: [from]
      properties:
        from: { type: string, format: date }
        days: { type: integer, minimum: 1, maximum: 14, default: 7 }
        wish: { type: string, maxLength: 200, description: "What to use up or what you feel like, in your own words." }

    Rating:
      type: string
      enum: [love, fine, nope]
      description: Nope means not again.

    RatingChoice:
      type: object
      required: [rating]
      properties:
        rating: { $ref: "#/components/schemas/Rating" }

    MealRating:
      type: object
      required: [slug, name, userId, rating, ratedAt]
      properties:
        slug: { type: string }
        name: { type: string }
        userId: { type: string, format: uuid }
        rating: { $ref: "#/components/schemas/Rating" }
        ratedAt: { type: string, format: date-time }

    Taste:
      type: object
      required: [ratings]
      properties:
        ratings:
          type: array
          items: { $ref: "#/components/schemas/MealRating" }

    CookedDish:
      type: object
      required: [slug, name, times, last]
      properties:
        slug: { type: string }
        name: { type: string }
        times: { type: integer, description: How many meal memories the year holds of it. }
        last: { type: string, format: date, description: The day it was cooked last. }

    MealRecap:
      type: object
      required: [year, memories, dishes, favourites, photos]
      properties:
        year: { type: integer }
        memories: { type: integer, description: How many meal memories you can read from the year. }
        dishes:
          type: array
          description: The dishes cooked most, most first; at most five.
          items: { $ref: "#/components/schemas/CookedDish" }
        favourites:
          type: array
          description: The year's dishes every member who rated them loved, when at least two did.
          items: { $ref: "#/components/schemas/CookedDish" }
        photos:
          type: array
          description: The newest meal memories with a photo; at most twelve.
          items: { $ref: "#/components/schemas/Moment" }

    MealIdeas:
      type: object
      required: [meals, chef]
      properties:
        meals:
          type: array
          items: { $ref: "#/components/schemas/MealIdea" }
        chef: { type: boolean, description: True when Claude picked; false for the random fallback. }

    MealIdea:
      type: object
      required: [day, recipe]
      properties:
        day: { type: string, format: date }
        recipe: { $ref: "#/components/schemas/RecipeSummary" }
        reason: { type: string, description: Why it fits, in the request's language. Absent for random picks. }

    AddMealsToShoppingList:
      type: object
      required: [recipes]
      properties:
        recipes:
          type: array
          minItems: 1
          maxItems: 14
          items: { $ref: "#/components/schemas/AddToShoppingList" }

    ShoppingListAdded:
      type: object
      required: [added, list]
      properties:
        added: { type: integer, description: How many ingredients were put on the list. }
        list: { type: string, description: "The shopping list's name, in the request's language." }

    NewShoppingItem:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }

    ShoppingAisle:
      type: string
      enum: [produce, bakery, meat, dairy, frozen, pantry, drinks, household, other]
      description: >-
        Where in the shop the item is, listed in this order. New items go where the household put the
        same thing before, else where Claude says, else `other`.

    ShoppingItemUpdate:
      type: object
      required: [aisle]
      properties:
        aisle: { $ref: "#/components/schemas/ShoppingAisle" }

    ShoppingItem:
      type: object
      required: [id, text, aisle, done, createdAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        aisle: { $ref: "#/components/schemas/ShoppingAisle" }
        recipe: { type: string, description: "The recipe the item came from, if any." }
        addedBy: { type: string, format: uuid, description: Who added it; absent once they left. }
        done: { type: boolean }
        doneAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    BucketKind:
      type: string
      enum: [watch, read, visit]
      description: Something to watch, to read, or a place to visit.

    NewBucketItem:
      type: object
      required: [kind, text]
      properties:
        kind: { $ref: "#/components/schemas/BucketKind" }
        text: { type: string, minLength: 1, maxLength: 200 }

    BucketItem:
      type: object
      required: [id, kind, text, done, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/BucketKind" }
        text: { type: string }
        addedBy: { type: string, format: uuid, description: Who added it; absent once they left. }
        done: { type: boolean, description: Watched, read or been there. }
        doneAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    TitleSuggestion:
      type: object
      required: [text, uses]
      properties:
        text: { type: string, description: "The title, as it was last written." }
        uses: { type: integer, minimum: 1, description: How often it was used. }

    ExpenseCategory:
      type: string
      enum: [groceries, dining, home, utilities, transport, travel, fun, health, gifts, other]
      description: What it was spent on. Settlements are `other`.

    ExpenseShare:
      type: object
      required: [userId, cents]
      properties:
        userId: { type: string, format: uuid }
        cents: { type: integer, format: int64, minimum: 0, description: "This member's part, in cents." }

    ExpenseFields:
      type: object
      required: [cents, category, paidBy]
      properties:
        cents: { type: integer, format: int64, minimum: 1, maximum: 10000000, description: The amount in cents (EUR). }
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        note: { type: string, maxLength: 200 }
        paidBy: { type: string, format: uuid, description: The member who paid. }
        day: { type: string, format: date, description: "The day it was spent; today when absent." }
        shares:
          type: array
          maxItems: 50
          description: >-
            Who carries how much: members, each once, adding up to `cents`. Absent or empty: evenly
            between all members.
          items: { $ref: "#/components/schemas/ExpenseShare" }

    Expense:
      type: object
      required: [id, kind, cents, category, paidBy, day, shares, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [expense, settlement]
          description: "A settlement is money `paidBy` gave the member in its one share."
        cents: { type: integer, format: int64 }
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        note: { type: string }
        paidBy: { type: string, format: uuid }
        day: { type: string, format: date }
        shares:
          type: array
          description: Members with a part above zero.
          items: { $ref: "#/components/schemas/ExpenseShare" }
        addedBy: { type: string, format: uuid, description: Who wrote it down; absent once they left. }
        receiptUrl: { type: string, description: "The photo of the receipt, if there is one; it changes with the photo." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExpenseMonth:
      type: object
      required: [month, expenses, total, categories]
      properties:
        month: { $ref: "#/components/schemas/Month" }
        expenses:
          type: array
          items: { $ref: "#/components/schemas/Expense" }
        total: { type: integer, format: int64, description: "What was spent this month, in cents. Settlements don't count." }
        categories:
          type: array
          description: What was spent per category, most first; categories without spending are left out.
          items: { $ref: "#/components/schemas/CategoryTotal" }
        earlier: { $ref: "#/components/schemas/Month", description: "The latest earlier month with an expense; absent when there is none." }

    Bill:
      type: object
      description: >-
        Shared reminders only: ticking it off books this as an expense, split evenly, with the
        reminder's text as the note. A repeating reminder is a recurring bill.
      required: [cents, category]
      properties:
        cents: { type: integer, format: int64, minimum: 1, maximum: 10000000 }
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        paidBy: { type: string, format: uuid, description: "The member who pays it; absent means whoever ticks it off." }

    CategoryTotal:
      type: object
      required: [category, cents]
      properties:
        category: { $ref: "#/components/schemas/ExpenseCategory" }
        cents: { type: integer, format: int64 }

    NewSettlement:
      type: object
      required: [from, to, cents]
      properties:
        from: { type: string, format: uuid, description: The member who paid. }
        to: { type: string, format: uuid, description: The member who got the money. }
        cents: { type: integer, format: int64, minimum: 1, maximum: 10000000 }
        day: { type: string, format: date, description: "Today when absent." }

    Balance:
      type: object
      required: [members, transfers]
      properties:
        members:
          type: array
          description: Every member, and anyone who left while still owing or being owed.
          items: { $ref: "#/components/schemas/MemberBalance" }
        transfers:
          type: array
          description: Payments that settle everything; empty when everyone is even.
          items: { $ref: "#/components/schemas/Transfer" }

    MemberBalance:
      type: object
      required: [userId, cents]
      properties:
        userId: { type: string, format: uuid }
        cents: { type: integer, format: int64, description: "What they paid minus their shares: above zero they are owed, below zero they owe." }

    Transfer:
      type: object
      required: [from, to, cents]
      properties:
        from: { type: string, format: uuid }
        to: { type: string, format: uuid }
        cents: { type: integer, format: int64 }

    WishFields:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        note: { type: string, maxLength: 500 }
        url: { type: string, maxLength: 2000, description: "Where to see or buy it: an http or https address." }
        priceCents: { type: integer, format: int64, minimum: 1, maximum: 100000000 }

    WishVote:
      type: object
      required: [userId, hearts]
      properties:
        userId: { type: string, format: uuid }
        hearts: { type: integer, minimum: 1, maximum: 3 }

    Wish:
      type: object
      required: [id, title, note, url, hearts, votes, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        note: { type: string }
        url: { type: string, description: Empty when there is none. }
        priceCents: { type: integer, format: int64 }
        photoUrl: { type: string, description: "The photo, if there is one; it changes with the photo." }
        hearts: { type: integer, description: The sum of everyone's hearts, which ranks the list. }
        votes: { type: array, items: { $ref: "#/components/schemas/WishVote" } }
        gotAt: { type: string, format: date-time, description: When the wish came true. }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    ChoreFields:
      type: object
      required: [title, points]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        points: { type: integer, minimum: 1, maximum: 3, description: "The effort: 1 small, 2 medium, 3 big." }
        repeat: { $ref: "#/components/schemas/Repeat" }
        rotate: { type: boolean, description: Each time it is done it becomes the next member's turn. }
        assigneeId: { type: string, format: uuid, description: "Whose turn it is; absent means anyone's." }
        dueOn: { type: string, format: date, description: "The day it is due; today when absent." }

    Birthday:
      type: object
      required: [month, day]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        year: { type: integer, minimum: 1900, description: "Year of birth, up to this year. Optional; absent when not given." }

    GiftIdea:
      type: object
      required: [id, forId, text, given, createdAt]
      properties:
        id: { type: string, format: uuid }
        forId: { type: string, format: uuid, description: The member it is for. }
        text: { type: string }
        given: { type: boolean }
        givenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    NewGiftIdea:
      type: object
      required: [forId, text]
      properties:
        forId: { type: string, format: uuid, description: Another member of the household. }
        text: { type: string, minLength: 1, maxLength: 200 }

    GiftIdeaUpdate:
      type: object
      required: [given]
      properties:
        given: { type: boolean }

    GiftPerson:
      type: object
      required: [user, ideas]
      properties:
        user: { $ref: "#/components/schemas/User" }
        birthday: { $ref: "#/components/schemas/Birthday" }
        next:
          type: string
          format: date
          description: Their next birthday. Absent without a birthday.
        days: { type: integer, description: How many days until `next`; 0 is today. Absent without a birthday. }
        ideas: { type: integer, description: How many of your own open ideas are for them. }

    Gifts:
      type: object
      required: [people, ideas]
      properties:
        myBirthday: { $ref: "#/components/schemas/Birthday" }
        people:
          type: array
          description: The other members, soonest birthday first.
          items: { $ref: "#/components/schemas/GiftPerson" }
        ideas:
          type: array
          description: Only the caller's own ideas, open ones first.
          items: { $ref: "#/components/schemas/GiftIdea" }
    TripFields:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        destination: { type: string, maxLength: 80 }
        startOn: { type: string, format: date }
        endOn: { type: string, format: date, description: On or after `startOn`. }
        notes: { type: string, maxLength: 1000 }
        chosenOptionId: { type: string, format: uuid, description: The option the household decided on; one of the trip's options. }

    TripOptionFields:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, maxLength: 500, description: A link to the listing, http or https. }
        notes: { type: string, maxLength: 1000 }

    TripPhoto:
      type: object
      required: [id, url]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, description: Where to get the photo. }

    TripOption:
      type: object
      required: [id, title, photos, votes]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        url: { type: string }
        notes: { type: string }
        photos:
          type: array
          description: Oldest first; the first is the cover.
          items: { $ref: "#/components/schemas/TripPhoto" }
        votes:
          type: array
          description: The members whose favourite this is.
          items: { type: string, format: uuid }
        addedBy: { type: string, format: uuid, description: Absent once they left. }

    PackingFields:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 100 }
        done: { type: boolean, description: Packed already; false when absent. }

    PackingItem:
      type: object
      required: [id, text, done]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        done: { type: boolean }

    Trip:
      type: object
      required: [id, name, options, packing, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        destination: { type: string }
        startOn: { type: string, format: date }
        endOn: { type: string, format: date }
        notes: { type: string }
        chosenOptionId: { type: string, format: uuid }
        options:
          type: array
          items: { $ref: "#/components/schemas/TripOption" }
        packing:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/PackingItem" }
        createdAt: { type: string, format: date-time }

    Chore:
      type: object
      required: [id, title, points, repeat, rotate, dueOn, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        points: { type: integer }
        repeat: { $ref: "#/components/schemas/Repeat" }
        rotate: { type: boolean }
        assigneeId: { type: string, format: uuid }
        dueOn: { type: string, format: date }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    Document:
      type: object
      required: [id, ownerId, mine, name, contentType, size, shared, createdAt]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid, description: Who added it. }
        mine: { type: boolean }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64, description: Bytes. }
        shared:
          type: boolean
          description: Whether the whole household can see it. Private (false) until its owner shares it.
        createdAt: { type: string, format: date-time }

    DocumentChange:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        shared: { type: boolean }

    ChoreCompletion:
      type: object
      required: [id, title, points, userId, day, doneAt, thankedBy]
      properties:
        id: { type: string, format: uuid }
        choreId: { type: string, format: uuid, description: Absent once the chore was deleted. }
        title: { type: string }
        points: { type: integer }
        userId: { type: string, format: uuid, description: Who did it. }
        day: { type: string, format: date }
        doneAt: { type: string, format: date-time }
        thankedBy:
          type: array
          items: { type: string, format: uuid }

    ChoreThanks:
      type: object
      properties:
        gratitude: { type: string, maxLength: 200, description: "A line for your gratitude wall, written if you have none today." }

    ChoreThanked:
      type: object
      required: [completion]
      properties:
        completion: { $ref: "#/components/schemas/ChoreCompletion" }
        gratitude: { $ref: "#/components/schemas/Moment" }

    ChoreFairness:
      type: object
      required: [week, month]
      properties:
        week: { $ref: "#/components/schemas/ChoreTally" }
        month: { $ref: "#/components/schemas/ChoreTally" }

    ChoreTally:
      type: object
      required: [from, members]
      properties:
        from: { type: string, format: date }
        members:
          type: array
          items: { $ref: "#/components/schemas/ChoreShare" }

    ChoreShare:
      type: object
      required: [userId, points, count]
      properties:
        userId: { type: string, format: uuid }
        points: { type: integer }
        count: { type: integer }

    Home:
      type: object
      required: [connected, rooms, scenes, lights, readings]
      properties:
        connected: { type: boolean, description: Whether you have connected your Home Assistant account. }
        rooms:
          type: array
          description: Rooms that hold at least one scene, light or reading, by name.
          items: { $ref: "#/components/schemas/Room" }
        scenes:
          type: array
          items: { $ref: "#/components/schemas/Scene" }
        lights:
          type: array
          items: { $ref: "#/components/schemas/Light" }
        readings:
          type: array
          items: { $ref: "#/components/schemas/Reading" }

    Room:
      type: object
      required: [id, name]
      properties:
        id: { type: string, description: "Home Assistant area id, e.g. kitchen." }
        name: { type: string }

    HomeConnect:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "Home Assistant's sign-in page." }

    ConnectURL:
      type: object
      required: [url]
      properties:
        url: { type: string, description: The sign-in page to send the browser to. }

    MediaId:
      type: string
      pattern: "^[A-Za-z0-9-]{1,64}\\.[0-9]{1,20}$"
      description: A library or title id from this API; it names the Plex server and the item there.

    WatchShelf:
      type: object
      required: [connected, libraries]
      properties:
        connected: { type: boolean, description: Whether you have connected your Plex account. }
        libraries:
          type: array
          description: Your own servers' libraries first, then shared ones, each in Plex's order.
          items: { $ref: "#/components/schemas/WatchLibrary" }

    WatchLibrary:
      type: object
      required: [id, name, kind, server, owned, included]
      properties:
        id: { $ref: "#/components/schemas/MediaId" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/MediaKind" }
        server: { type: string, description: The Plex server's name. }
        owned: { type: boolean, description: False for a library a friend shares with you. }
        included: { type: boolean, description: False for a library you left out. }

    WatchLibrarySetting:
      type: object
      required: [included]
      properties:
        included: { type: boolean }

    MediaKind:
      type: string
      enum: [movie, show]

    WatchTitle:
      type: object
      required: [id, kind, name, genres, watched]
      properties:
        id: { $ref: "#/components/schemas/MediaId" }
        kind: { $ref: "#/components/schemas/MediaKind" }
        name: { type: string }
        year: { type: integer }
        summary: { type: string }
        minutes: { type: integer, description: "A movie's length, or an episode's for a series." }
        genres: { type: array, items: { type: string } }
        rating: { type: number, description: Audience or critic rating out of 10. }
        contentRating: { type: string, description: "Age rating, e.g. de/12 or PG-13." }
        episodes: { type: integer, description: Episodes of a series. }
        watched: { type: boolean, description: "You have seen the movie, or every episode." }
        url: { type: string, format: uri, description: Opens the title in Plex. }

    WatchNight:
      type: object
      required: [deck, matches, partners]
      properties:
        deck:
          type: array
          items: { $ref: "#/components/schemas/WatchTitle" }
        matches:
          type: array
          description: Films you both liked, as your own titles.
          items: { $ref: "#/components/schemas/WatchTitle" }
        partners: { type: integer, description: How many other members could swipe. }

    WatchSwipe:
      type: object
      required: [titleId, liked]
      properties:
        titleId: { $ref: "#/components/schemas/MediaId" }
        liked: { type: boolean }

    WatchSwipeResult:
      type: object
      properties:
        match: { $ref: "#/components/schemas/WatchTitle" }

    WatchTonight:
      type: object
      properties:
        pick: { $ref: "#/components/schemas/TonightPick" }

    WatchTonightChoice:
      type: object
      required: [titleId]
      properties:
        titleId: { $ref: "#/components/schemas/MediaId" }

    TonightPick:
      type: object
      required: [titleId, kind, name, pickedBy, pickedAt]
      properties:
        titleId: { $ref: "#/components/schemas/MediaId" }
        kind: { $ref: "#/components/schemas/MediaKind" }
        name: { type: string }
        year: { type: integer }
        url: { type: string, format: uri, description: Opens the title in Plex. }
        pickedBy: { type: string, format: uuid, description: The member who picked it. }
        pickedAt: { type: string, format: date-time }

    WatchMood:
      type: object
      properties:
        mood: { type: string, maxLength: 200, description: "In your own words, e.g. \"something light, under two hours\"; may be empty." }

    PlaceMatch:
      type: object
      required: [label]
      properties:
        label: { type: string, description: "How to write the place, e.g. \"Berlin, Germany\"." }

    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }

    DateNightRequest:
      type: object
      properties:
        place: { type: string, maxLength: 100, description: "A town or city; without it (and without a `location`) there is no forecast and no events." }
        location:
          allOf: [{ $ref: "#/components/schemas/Coordinates" }]
          description: "Where the device is. It wins over `place` for the forecast, and the town it is in stands in for `place` when that is empty."
        day: { type: string, format: date, description: "The evening, within 14 days from today in the household's time zone; defaults to today." }
        budget: { $ref: "#/components/schemas/DateBudget" }
        mood: { type: string, maxLength: 200, description: "In your own words, e.g. \"cosy, nothing loud\"; may be empty." }
        constraints: { type: string, maxLength: 200, description: "Limits every idea must respect, e.g. \"in a hotel, no kitchen\" or \"no car\"; may be empty." }

    DateBudget:
      type: string
      enum: [free, easy, treat]
      description: How much the evening may cost; `easy` when absent.

    DateNight:
      type: object
      required: [ideas]
      properties:
        ideas:
          type: array
          items: { $ref: "#/components/schemas/DateIdea" }
        forecast: { $ref: "#/components/schemas/DateForecast" }

    DateForecast:
      type: object
      required: [sky, condition, highC, lowC, rainPercent]
      properties:
        place: { type: string, description: "The town the forecast is for, such as \"Berlin\"; absent when unknown." }
        sky: { type: string, enum: [clear, cloudy, fog, rain, snow, storm], description: The weather in a word; good for an icon. }
        condition: { type: string, enum: [clear, mostlyClear, partlyCloudy, overcast, fog, drizzle, rain, freezingRain, showers, snow, snowShowers, thunderstorm], description: The weather described closely, from the forecast's weather code. }
        highC: { type: number }
        lowC: { type: number }
        rainPercent: { type: integer, minimum: 0, maximum: 100, description: Chance of rain or snow. }

    DateIdea:
      type: object
      required: [title, reason, indoor, startsAt]
      properties:
        title: { type: string }
        reason: { type: string, description: One warm sentence on why it fits. }
        where: { type: string, description: A venue or area; absent when it can be anywhere. }
        cost: { type: string, description: "A short phrase such as \"about 30 €\"; absent when free." }
        indoor: { type: boolean }
        startsAt: { type: string, format: date-time, description: When to start, on the day asked for. }

    WatchIdeas:
      type: object
      required: [ideas]
      properties:
        ideas:
          type: array
          items: { $ref: "#/components/schemas/WatchIdea" }

    WatchIdea:
      type: object
      required: [name, kind, reason]
      properties:
        name: { type: string }
        year: { type: integer }
        kind: { $ref: "#/components/schemas/MediaKind" }
        reason: { type: string, description: One short sentence on why it fits. }
        title: { $ref: "#/components/schemas/WatchTitle" }

    Scene:
      type: object
      required: [id, name]
      properties:
        id: { type: string, description: "Home Assistant entity id, e.g. scene.dinner." }
        name: { type: string }
        room: { type: string, description: The room's id; absent when it has none. }

    Light:
      type: object
      required: [id, name, on]
      properties:
        id: { type: string, description: "Home Assistant entity id, e.g. light.kitchen." }
        name: { type: string }
        room: { type: string, description: The room's id; absent when it has none. }
        on: { type: boolean }

    CallInvite:
      type: object
      required: [invite]
      properties:
        invite:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }
          description: The members to ring.

    Call:
      type: object
      required: [id, url, token, room, e2eeKey]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, description: "The LiveKit server to connect to (wss://)." }
        token: { type: string, description: "LiveKit access token for this person and room." }
        room: { type: string }
        e2eeKey:
          type: string
          description: |
            The shared key everyone in the call encrypts their audio and video with (LiveKit
            end-to-end encryption). LiveKit never gets it, so it can't read the media it forwards.
            Clients must not join without encryption, or nobody can hear or see them.

    VoiceSetup:
      type: object
      required: [available, settings]
      properties:
        available: { type: boolean, description: "Whether Homeloom can speak on this server: calls with it and previews." }
        settings: { $ref: "#/components/schemas/VoiceSettings" }

    VoiceSettings:
      type: object
      required: [voice, speed, tone]
      properties:
        voice:
          type: string
          enum: [marin, cedar, coral, sage, shimmer, nova, alloy, ash, ballad, echo, fable, onyx, verse]
        speed: { type: number, format: double, minimum: 0.75, maximum: 1.5, description: "1 is the voice's natural pace." }
        tone:
          type: string
          enum: [warm, calm, playful, clear]
          description: How Homeloom speaks, turned into instructions for the speech model.

    GuestLink:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    GuestCall:
      type: object
      required: [invitedBy]
      properties:
        invitedBy: { type: string, description: "The name of the member who made the link." }

    GuestJoin:
      type: object
      required: [name, device]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        device: { type: string, minLength: 16, maxLength: 100, description: "A random id this browser keeps for the link." }

    PushConfig:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: string, description: "The VAPID public key, base64url without padding." }

    PushTopicName:
      type: string
      enum: [briefing, reminders, questions, chores, gifts, us, watch, calls]

    PushTopic:
      type: object
      required: [topic, enabled]
      properties:
        topic: { $ref: "#/components/schemas/PushTopicName" }
        enabled: { type: boolean }

    PushSubscription:
      type: object
      required: [endpoint, keys]
      description: What `PushSubscription.toJSON()` returns in the browser.
      properties:
        endpoint: { type: string, maxLength: 2048 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 1, maxLength: 200 }
            auth: { type: string, minLength: 1, maxLength: 100 }

    Reading:
      type: object
      description: |
        A live, read-only state. Measurements (temperature, humidity, power, co2) have `value`
        and `unit`; the others (window, door, garage_door, motion, moisture, smoke) have `on`,
        which means open, detected or wet.
      required: [id, name, kind]
      properties:
        id: { type: string, description: "Home Assistant entity id, e.g. sensor.kitchen_temperature." }
        name: { type: string }
        room: { type: string, description: The room's id; absent when it has none. }
        kind:
          type: string
          enum: [temperature, humidity, power, co2, window, door, garage_door, motion, moisture, smoke]
        value: { type: number, format: double }
        unit: { type: string }
        "on": { type: boolean }

    Logout:
      type: object
      properties:
        redirectUrl: { type: string, description: authentik's end-session URL. }

    User:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: string, description: "The picture they set in Homeloom, else the one authentik sends, if any." }

    CreateHousehold:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    Household:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    HouseholdDetail:
      allOf:
        - $ref: "#/components/schemas/Household"
        - type: object
          required: [members]
          properties:
            place:
              type: string
              description: Where the household lives, as typed; absent until chosen.
            members:
              type: array
              items: { $ref: "#/components/schemas/Member" }

    Member:
      type: object
      required: [user, role]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/Role" }
        birthday: { $ref: "#/components/schemas/Birthday" }

    Role:
      type: string
      enum: [owner, member]

    ChatRequest:
      type: object
      required: [text]
      properties:
        conversationId: { type: string, format: uuid, description: Continue this conversation; absent starts a new one. }
        text: { type: string, minLength: 1, maxLength: 2000 }

    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, description: The start of its first message. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    McpTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: Which app it is for. }
        access: { $ref: "#/components/schemas/TokenAccess" }

    TokenAccess:
      type: string
      enum: [tools, calendar, notes]
      default: tools
      description: |
        What it opens: `tools` is the assistant's tools at /mcp (a bearer key), `calendar` is your
        events and reminders over CalDAV at /dav (a password), `notes` is your notes as files over
        WebDAV at /webdav (a password).

    McpToken:
      type: object
      required: [id, name, access, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        access: { $ref: "#/components/schemas/TokenAccess" }
        createdAt: { type: string, format: date-time }

    McpTokenCreated:
      allOf:
        - $ref: "#/components/schemas/McpToken"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: The bearer key or the calendar password. }

    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: "#/components/schemas/ChatMessage" }

    ChatMessage:
      type: object
      required: [id, role, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        text: { type: string }
        createdAt: { type: string, format: date-time }

    ChatTool:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            The tool: `list_entries`, `add_reminder`, `add_event`, `add_note`, `complete_reminder`,
            `search_recipes`, `get_recipe`, `list_shopping`, `add_to_shopping_list`, `get_home`,
            `activate_scene` or `set_light`. More may come.

    ChatText:
      type: object
      required: [text]
      properties:
        text: { type: string }
